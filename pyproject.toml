[project]
name = "vyuha"
version = "0.1.0"
description = "Turn a distributor's messy Excel file into a business dashboard."
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2",
    "openpyxl>=3.1",
]

[project.scripts]
vyuha = "vyuha.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vyuha*"]
