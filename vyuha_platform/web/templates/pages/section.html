{% extends "layouts/section.html" %}
{# Only reached while a listed page is still being built; every page in nav.py gets its own
   template, so in a finished build nothing lands here. #}
{% block page %}
<section class="card p-8" data-testid="page-building">
  <p class="eyebrow">Being built</p>
  <h2 class="mt-2 text-xl font-bold">{{ pg.label }}</h2>
  <p class="mt-1 max-w-xl text-ink-2">{{ pg.blurb }}.</p>
</section>
{% endblock %}
